name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # perlu untuk membuat GitHub Release saat tag v*

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Versi
        run: |
          echo "VERSION_CODE=$((40 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=3.13.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Unit test
        run: gradle testDebugUnitTest --no-daemon

      - name: Siapkan keystore rilis (opsional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore rilis dipakai."
          else
            echo "::warning::KEYSTORE_B64 kosong → APK rilis ditandatangani kunci debug."
          fi

      - name: Build APK debug + rilis
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Ganti nama APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/BGAP-SPEAKER-${VERSION_NAME}-release.apk"
          cp app/build/outputs/apk/debug/*.apk   "dist/BGAP-SPEAKER-${VERSION_NAME}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BGAP-SPEAKER-${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload laporan tes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-tes
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: GitHub Release (hanya tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
